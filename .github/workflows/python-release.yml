name: Python release

on:
  push:
    tags: ["python-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: lts
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]
      - run: rustup target add wasm32-unknown-unknown
      - run: vp run verify
      - run: bun tooling/export-contracts.ts
      - name: Match release tag to package versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, pathlib, tomllib
          package = pathlib.Path("packages/python")
          version = tomllib.loads((package / "pyproject.toml").read_text())["project"]["version"]
          native = tomllib.loads((package / "rust/Cargo.toml").read_text())["package"]["version"]
          assert native == version
          assert os.environ["GITHUB_REF_NAME"] == f"python-v{version}"
      - uses: actions/upload-artifact@v4
        with:
          name: python-release-contracts
          path: .performance/python/*.json
          include-hidden-files: true
          if-no-files-found: error

  wheels:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ startsWith(matrix.platform.target, 'aarch64') && 'arm64' || 'x64' }}
      - uses: actions/download-artifact@v4
        with:
          name: python-release-contracts
          path: .performance/python
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/python
          target: ${{ matrix.platform.target }}
          manylinux: "2014"
          args: >-
            --release --locked
            --interpreter ${{ runner.os == 'Linux' && format('python{0}', matrix.python) || 'python' }}
            --out ../../.performance/python-release/wheels
      - run: python -m pip install mypy
      - name: Verify the exact release wheel
        shell: bash
        run: python tooling/check-python.py --wheel .performance/python-release/wheels/*.whl --out .performance/python-release/acceptance
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.platform.target }}-${{ matrix.python }}
          path: .performance/python-release/wheels/*.whl
          include-hidden-files: true
          if-no-files-found: error

  source:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: python-release-contracts
          path: .performance/python
      - run: python -m pip install "maturin>=1.15,<2" mypy nbclient ipykernel
      - run: python tooling/check-python.py
      - shell: bash
        run: |
          python -m pip install .performance/python-acceptance/wheels/*.whl markdown-it-py
          python tooling/check-notebook.py --out .performance/notebook-acceptance
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: .performance/python-acceptance/wheels/*.tar.gz
          include-hidden-files: true
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/python-v')
    needs: [wheels, source]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/multimd-table
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: python-sdist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install twine
      - run: python -m twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
