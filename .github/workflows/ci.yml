name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: rustup target add wasm32-unknown-unknown
      - run: bun run check
      - run: bun run check:package
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: rustup target add wasm32-unknown-unknown
      - run: bun run bench --quick --out .performance/ci
      - uses: actions/upload-artifact@v4
        with:
          name: performance-${{ github.sha }}
          path: .performance/ci-*.json
          include-hidden-files: true
          if-no-files-found: error
