name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: lts
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]
      - run: rustup target add wasm32-unknown-unknown
      - run: vp run verify
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: lts
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]
      - run: rustup target add wasm32-unknown-unknown
      - run: vp run bench --quick --out .performance/ci
      - uses: actions/upload-artifact@v4
        with:
          name: performance-${{ github.sha }}
          path: .performance/ci-*.json
          include-hidden-files: true
          if-no-files-found: error
