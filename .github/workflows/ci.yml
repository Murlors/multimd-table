name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: lts
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]
      - run: rustup target add wasm32-unknown-unknown
      - run: vp run verify
      - run: bun tooling/export-contracts.ts
      - uses: actions/upload-artifact@v4
        with:
          name: python-contracts-${{ github.sha }}
          path: |
            .performance/python/vectors.json
            .performance/python/adapters.json
          include-hidden-files: true
          if-no-files-found: error
  python:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      MULTIMD_VECTORS: ${{ github.workspace }}/.performance/python/vectors.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: python-contracts-${{ github.sha }}
          path: .performance/python
      - run: python -m pip install "maturin>=1.15,<2" mypy
      - run: cargo fmt --manifest-path packages/python/rust/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path packages/python/rust/Cargo.toml -- -D warnings
      - run: python tooling/check-python.py
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: |
          python -m pip install .performance/python-acceptance/wheels/*.whl nbclient ipykernel markdown-it-py
          python tooling/check-notebook.py --out .performance/notebook-acceptance
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: |
            .performance/python-acceptance/wheels/*
            .performance/python-acceptance/wheels.json
            .performance/python-acceptance/report.json
          include-hidden-files: true
          if-no-files-found: error
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: lts
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]
      - run: rustup target add wasm32-unknown-unknown
      - run: vp run bench --quick --out .performance/ci
      - uses: actions/upload-artifact@v4
        with:
          name: performance-${{ github.sha }}
          path: .performance/ci-*.json
          include-hidden-files: true
          if-no-files-found: error
