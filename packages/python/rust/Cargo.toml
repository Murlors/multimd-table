[package]
name = "multimd-table-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
multimd-table-core = { path = "../../../crates/core", default-features = false }
pyo3 = "0.30.1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
