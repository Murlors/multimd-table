[package]
name = "multimd-table-core"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
regex = { version = "1.12", default-features = false, features = ["std", "perf"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
